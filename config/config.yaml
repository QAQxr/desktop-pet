# Desktop Pet configuration
# All tunable runtime parameters live here instead of being hard-coded.

walk_speed: 80.0          # legacy alias; movement.speed is authoritative (Step 6)
idle_time: 5.0            # seconds spent idling on average
window_scale: 1.0         # overall UI scale
behavior_enabled: true    # master switch for the rule-based behaviour engine

window:
  pet_height: 220         # rendered character height in pixels
  always_on_top: false    # keep the pet above other windows
  start_x: null           # null -> place near bottom-right of the screen
  start_y: null

assets:
  generated_root: picture/generated
  original_root: picture/original
  fallback: picture/original/file.png

platform:
  # null -> auto-detect. "xcb" forces X11/XWayland, "wayland" forces native.
  override: null
  prefer_x11_for_positioning: true

animation:
  enabled: true
  fps: 30
  idle:
    enabled: true
    duration: 3.0         # seconds per breathing cycle
    float_amplitude: 2.0  # vertical bob in pixels (peak)
    scale_amplitude: 0.01 # +/- fraction of scale (breathing)
    rotation_amplitude: 0.0  # degrees; 0 disables tilt

movement:
  enabled: true
  speed: 120.0            # pixels per second
  direction: right        # left | right | up | down (used by --movement-test)
  fps: 60                 # movement tick rate

interaction:
  enabled: true
  input_mask: true        # clip input (and X11 window shape) to the character silhouette
  mask_alpha_threshold: 1 # alpha <= this is treated as transparent
  mask_dilate: 3          # px margin so the moving sprite stays clickable
  click_threshold: 4.0    # px; pointer travel below this counts as a click, above as a drag
  drag_enabled: true
